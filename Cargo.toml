[package]
name = "cellar"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A pure Rust reader for Excel and OpenDocument spreadsheet files"
license = "MIT"
keywords = ["excel", "ods", "xls", "xlsx", "spreadsheet"]
categories = ["text-processing", "parsing", "encoding"]
repository = "https://github.com/EdisonJwa/cellar-rs"
homepage = "https://github.com/EdisonJwa/cellar-rs"
documentation = "https://docs.rs/cellar"
readme = "README.md"
# The comparison harness is a separate workspace that exists to measure this crate against
# another reader. It is not part of the library and pulls a dependency this crate does not have.
exclude = ["compare/", "fuzz/"]

[dependencies]
# Archive container backend. Deliberately the ONLY non-optional dependency, and
# deliberately isolated behind `container::Archive` in src/container.rs so it can be
# swapped without touching any format reader. It is `zipcore`, this project's own
# from-scratch ZIP reader: no `zip` crate, no `unsafe`, ZIP64, and a streaming entry
# reader that a windowed read can abandon partway through.
zipcore = "0.2"
chrono = { version = "0.4", optional = true, default-features = false, features = [
    "std",
] }
serde = { version = "1", optional = true, default-features = false, features = [
    "std",
] }
encoding_rs = { version = "0.8", optional = true, default-features = false, features = [
    "alloc",
] }

[dev-dependencies]
tempfile = "3"
serde = { version = "1", features = ["derive"] }
criterion = "0.8"
# Kept as an independent oracle for the fixture builders: archives written by a different
# implementation than the one reading them, so a symmetric bug cannot cancel itself out.
zip = { version = "9.0.3", default-features = false, features = [
    "deflate-flate2-zlib-rs",
] }

[[bench]]
name = "read"
harness = false

[features]
default = []
dates = ["dep:chrono"]
chrono = ["dep:chrono"]
serde = ["dep:serde"]
# Decodes compressed BIFF strings using the workbook's declared code page.
codepage = ["dep:encoding_rs"]

[lints.rust]
# The library itself forbids `unsafe`; see the attribute in src/lib.rs. Test scaffolding is
# allowed to use it, because measuring peak allocation needs a global allocator.
# Every public item carries documentation, enforced rather than intended.
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
