[package]
name = "cellar-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
cellar = { path = ".." }

# Detaches this crate from the parent package, so `cargo build` and `cargo test` at the root
# never try to compile it. Fuzzing runs on nightly via `cargo +nightly fuzz run open`.
[workspace]

[[bin]]
name = "open"
path = "fuzz_targets/open.rs"
test = false
doc = false
bench = false
